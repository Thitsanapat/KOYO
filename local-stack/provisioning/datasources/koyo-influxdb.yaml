apiVersion: 1

datasources:
  - name: KOYO InfluxDB
    uid: koyo-influxdb
    type: influxdb
    access: proxy
    url: http://localhost:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: koyo
      defaultBucket: koyo_telemetry
      tlsSkipVerify: true
    secureJsonData:
      token: koyo-local-dev-token
    editable: true
